name: Feed health collector (hourly)

# Records each feed's build age, content versions, employer checks and Jobiqo gaps in
# BigQuery (site-monitoring-421401.feed_health). The repo is public, so its run logs are too:
# feed URLs and keys come only from secrets, and the feed bucket is masked before anything runs.
# GitHub's cron is best effort (and is disabled after 60 days without activity in a public
# repo), so runs can also be started from outside through workflow_dispatch.

on:
  schedule:
    # hh:47 UTC every hour: off the top of the hour, where GitHub delays and drops scheduled
    # runs the most, and clear of jpd-refresh-scheduler's :37.
    - cron: '47 * * * *'
  workflow_dispatch:

# One writer at a time: the commit-marker writes assume no concurrent run.
concurrency:
  group: feed-health-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # A no-change run takes ~10s of work.
    timeout-minutes: 5
    env:
      FEED_MAP_URL: ${{ secrets.FEED_MAP_URL }}
      JOBIQO_EXPORT_URL: ${{ secrets.JOBIQO_EXPORT_URL }}
      # Daily HubSpot company sync (first run after 06:00 UTC). The log prints counts only.
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
      BQ_PROJECT: site-monitoring-421401
      BQ_DATASET: feed_health
      BQ_LOCATION: EU
      GOOGLE_APPLICATION_CREDENTIALS: .Feed-health-collector_ServiceKey.json

    steps:
      # GitHub masks a secret only where its exact value appears. A feed file's URL isn't a
      # secret itself, so mask the bucket all the feeds live in (the first path segment of
      # the feed map URL): no feed URL can then reach this public log, even in an error.
      - name: Mask the feed bucket in logs
        run: |
          if [ -z "$FEED_MAP_URL" ]; then
            echo "::error::Repository secret FEED_MAP_URL is not set."
            exit 1
          fi
          path="${FEED_MAP_URL#*://*/}"
          echo "::add-mask::${path%%/*}"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account key
        env:
          FEED_HEALTH_COLLECTOR_KEY: ${{ secrets.FEED_HEALTH_COLLECTOR_KEY }}
        run: |
          if [ -z "$FEED_HEALTH_COLLECTOR_KEY" ]; then
            echo "::error::Repository secret FEED_HEALTH_COLLECTOR_KEY is not set."
            exit 1
          fi
          umask 077
          printf '%s' "$FEED_HEALTH_COLLECTOR_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Collect
        run: python -m feed_health.collect

      - name: Clean up credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
